{% extends 'base.html' %}

{% set page_title = page_title|default('Login') %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card tdeck-soft">
        <div class="card-body">
          <h1 class="h4 mb-3">Login</h1>

          {% if message %}
            <div class="alert alert-info py-2">{{ message }}</div>
          {% endif %}
          {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
          {% endif %}

          <form method="post" action="/login" autocomplete="on">
            <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
            <input type="hidden" name="next" value="{{ next or '' }}">

            <div class="mb-3">
              <label class="form-label" for="login-username">Username</label>
              <input class="form-control" id="login-username" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="next" required>
            </div>
            <div class="mb-3">
              <label class="form-label" for="login-password">Password</label>
              <input class="form-control" id="login-password" name="password" type="password" autocomplete="current-password" enterkeyhint="go" required>
            </div>

            <button class="btn btn-primary w-100" type="submit">Sign in</button>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
